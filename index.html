<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure QR Code App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login Styles */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #111;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #555;
            background: #333;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            background: #444;
            color: #666;
            cursor: not-allowed;
        }

        .btn-full {
            width: 100%;
        }

        .error {
            color: #ff4444;
            margin-top: 10px;
            text-align: center;
        }

        /* App Styles */
        .app-container {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            border-bottom-color: #fff;
            background: #111;
        }

        .tab:hover {
            background: #111;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: #111;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .section h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            margin-bottom: 15px;
        }

        .qr-preview {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: #222;
            border-radius: 8px;
        }

        .qr-preview canvas {
            max-width: 100%;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1;
            min-width: 120px;
        }

        .file-input {
            margin: 15px 0;
        }

        .file-input input[type="file"] {
            background: #222;
            border: 2px dashed #444;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }

        .video-container {
            text-align: center;
            margin: 20px 0;
        }

        #video {
            max-width: 100%;
            border-radius: 8px;
            background: #222;
        }

        .result-box {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #fff;
        }

        .result-box h4 {
            margin-bottom: 10px;
            color: #fff;
        }

        .result-text {
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.4;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: center;
        }

        .status.success {
            background: #004400;
            border: 1px solid #008800;
        }

        .status.error {
            background: #440000;
            border: 1px solid #880000;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 20px;
            }

            .section {
                padding: 20px 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group button {
                width: 100%;
            }

            .logout-btn {
                position: static;
                margin-bottom: 20px;
                width: 100%;
            }

            .header {
                margin-top: 20px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h1>🔐 Secure QR</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-full">Login</button>
                <div id="loginError" class="error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="appPage" class="app-container">
        <div class="container">
            <button id="logoutBtn" class="logout-btn">Logout</button>
            
            <div class="header">
                <h1>🔐 Secure QR Code App</h1>
                <p>Generate encrypted QR codes that standard scanners cannot read</p>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="encrypt">🔐 Encrypt & Generate</div>
                <div class="tab" data-tab="scan">📷 Scan & Decrypt</div>
            </div>

            <!-- Encrypt Tab -->
            <div id="encrypt-tab" class="tab-content active">
                <div class="section">
                    <h3>Encrypt Message & Generate QR Code</h3>
                    
                    <div class="form-group">
                        <label for="messageInput">Message to Encrypt</label>
                        <textarea id="messageInput" placeholder="Enter your secret message here..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="encryptPassword">Encryption Password</label>
                        <input type="password" id="encryptPassword" placeholder="Enter encryption password">
                    </div>

                    <button id="generateBtn" class="btn-full">Generate Secure QR Code</button>

                    <div id="qrPreview" class="qr-preview hidden">
                        <h4>Generated QR Code</h4>
                        <canvas id="qrCanvas"></canvas>
                        <div class="button-group" style="margin-top: 15px;">
                            <button id="saveQrBtn">Save as PNG</button>
                            <button id="copyEncryptedBtn">Copy Encrypted Data</button>
                        </div>
                    </div>

                    <div id="encryptResult" class="result-box hidden">
                        <h4>Encrypted Data</h4>
                        <div id="encryptedText" class="result-text"></div>
                    </div>
                </div>
            </div>

            <!-- Scan Tab -->
            <div id="scan-tab" class="tab-content">
                <div class="section">
                    <h3>Scan QR Code from Camera</h3>
                    
                    <div class="button-group">
                        <button id="startCameraBtn">Start Camera</button>
                        <button id="stopCameraBtn" disabled>Stop Camera</button>
                    </div>

                    <div class="video-container">
                        <video id="video" width="320" height="240" style="display: none;"></video>
                        <canvas id="scanCanvas" style="display: none;"></canvas>
                    </div>

                    <div class="form-group">
                        <label for="decryptPassword">Decryption Password</label>
                        <input type="password" id="decryptPassword" placeholder="Enter decryption password">
                    </div>

                    <button id="manualDecryptBtn" class="btn-full" style="margin-top: 10px;">Manual Decrypt from Camera</button>

                    <div id="cameraStatus" class="status hidden"></div>
                </div>

                <div class="section">
                    <h3>Upload QR Code Image</h3>
                    
                    <div class="file-input">
                        <input type="file" id="fileInput" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label for="uploadDecryptPassword">Decryption Password</label>
                        <input type="password" id="uploadDecryptPassword" placeholder="Enter decryption password">
                    </div>

                    <button id="uploadDecryptBtn" class="btn-full">Decrypt Uploaded QR</button>

                    <div id="uploadStatus" class="status hidden"></div>
                </div>

                <div id="decryptResult" class="result-box hidden">
                    <h4>Decrypted Message</h4>
                    <div id="decryptedText" class="result-text"></div>
                    <button id="copyDecryptedBtn" style="margin-top: 10px;">Copy Message</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Include external libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        // Configuration
        const CONFIG = {
            username: 'admin',
            password: 'secure123',
            qrOptions: {
                width: 300,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#FFFFFF'
                },
                errorCorrectionLevel: 'M'
            }
        };

        // Global variables
        let videoStream = null;
        let isScanning = false;

        // Authentication
        class Auth {
            static login(username, password) {
                return username === CONFIG.username && password === CONFIG.password;
            }

            static showApp() {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('appPage').style.display = 'block';
            }

            static showLogin() {
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('appPage').style.display = 'none';
            }
        }

        // Encryption utilities
        class CryptoUtil {
            static encrypt(message, password) {
                try {
                    // Create salt and IV
                    const salt = CryptoJS.lib.WordArray.random(128/8);
                    const iv = CryptoJS.lib.WordArray.random(128/8);
                    
                    // Derive key using PBKDF2
                    const key = CryptoJS.PBKDF2(password, salt, {
                        keySize: 256/32,
                        iterations: 1000
                    });
                    
                    // Encrypt the message
                    const encrypted = CryptoJS.AES.encrypt(message, key, {
                        iv: iv,
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    });

                    // Combine salt, iv, and encrypted data
                    const combined = {
                        salt: salt.toString(),
                        iv: iv.toString(),
                        encrypted: encrypted.toString()
                    };
                    
                    return btoa(JSON.stringify(combined));
                } catch (error) {
                    console.error('Encryption error:', error);
                    throw new Error('Failed to encrypt message: ' + error.message);
                }
            }

            static decrypt(encryptedData, password) {
                try {
                    // Parse the encrypted data
                    const combined = JSON.parse(atob(encryptedData));
                    
                    if (!combined.salt || !combined.iv || !combined.encrypted) {
                        throw new Error('Invalid encrypted data format');
                    }

                    const salt = CryptoJS.enc.Hex.parse(combined.salt);
                    const iv = CryptoJS.enc.Hex.parse(combined.iv);

                    // Derive the same key
                    const key = CryptoJS.PBKDF2(password, salt, {
                        keySize: 256/32,
                        iterations: 1000
                    });

                    // Decrypt
                    const decrypted = CryptoJS.AES.decrypt(combined.encrypted, key, {
                        iv: iv,
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    });

                    const decryptedText = decrypted.toString(CryptoJS.enc.Utf8);
                    
                    if (!decryptedText) {
                        throw new Error('Invalid password or corrupted data');
                    }

                    return decryptedText;
                } catch (error) {
                    console.error('Decryption error:', error);
                    if (error.message.includes('Invalid password')) {
                        throw new Error('Incorrect password');
                    }
                    throw new Error('Failed to decrypt: Invalid data or wrong password');
                }
            }
        }

        // QR Code utilities
        class QRUtil {
            static async generateQR(data) {
                try {
                    const canvas = document.getElementById('qrCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Create QR code using qrcode-generator
                    const qr = qrcode(0, 'M');
                    qr.addData(data);
                    qr.make();
                    
                    // Set canvas size
                    const size = 300;
                    canvas.width = size;
                    canvas.height = size;
                    
                    // Clear canvas
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, size, size);
                    
                    // Draw QR code
                    const moduleCount = qr.getModuleCount();
                    const cellSize = size / moduleCount;
                    
                    ctx.fillStyle = '#000000';
                    for (let row = 0; row < moduleCount; row++) {
                        for (let col = 0; col < moduleCount; col++) {
                            if (qr.isDark(row, col)) {
                                ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                            }
                        }
                    }
                    
                    return canvas;
                } catch (error) {
                    console.error('QR generation error:', error);
                    throw new Error('Failed to generate QR code: ' + error.message);
                }
            }

            static scanFromCanvas(canvas) {
                try {
                    const context = canvas.getContext('2d');
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Use jsQR to scan the QR code
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });
                    
                    if (code && code.data) {
                        console.log('QR code detected:', code.data);
                        return code.data;
                    }
                    return null;
                } catch (error) {
                    console.error('QR scan error:', error);
                    throw new Error('Failed to scan QR code: ' + error.message);
                }
            }

            static processImageFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            
                            canvas.width = img.width;
                            canvas.height = img.height;
                            context.drawImage(img, 0, 0);
                            
                            try {
                                const qrData = QRUtil.scanFromCanvas(canvas);
                                resolve(qrData);
                            } catch (error) {
                                reject(error);
                            }
                        };
                        img.onerror = () => reject(new Error('Failed to load image'));
                        img.src = e.target.result;
                    };
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsDataURL(file);
                });
            }
        }

        // Camera utilities
        class CameraUtil {
            static async startCamera() {
                try {
                    const video = document.getElementById('video');
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    
                    video.srcObject = stream;
                    video.style.display = 'block';
                    
                    return new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            video.play();
                            resolve(stream);
                        };
                    });
                } catch (error) {
                    console.error('Camera error:', error);
                    throw new Error('Failed to access camera: ' + error.message);
                }
            }

            static stopCamera(stream) {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                const video = document.getElementById('video');
                video.style.display = 'none';
                video.srcObject = null;
            }

            static captureFrame() {
                const video = document.getElementById('video');
                const canvas = document.getElementById('scanCanvas');
                const context = canvas.getContext('2d');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0);
                
                return QRUtil.scanFromCanvas(canvas);
            }
        }

        // UI utilities
        class UIUtil {
            static showStatus(elementId, message, type = 'info') {
                const element = document.getElementById(elementId);
                element.textContent = message;
                element.className = `status ${type}`;
                element.classList.remove('hidden');
                
                if (type === 'success' || type === 'error') {
                    setTimeout(() => {
                        element.classList.add('hidden');
                    }, 5000);
                }
            }

            static showElement(elementId) {
                document.getElementById(elementId).classList.remove('hidden');
            }

            static hideElement(elementId) {
                document.getElementById(elementId).classList.add('hidden');
            }

            static copyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    UIUtil.showStatus('cameraStatus', 'Copied to clipboard!', 'success');
                }).catch(() => {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    UIUtil.showStatus('cameraStatus', 'Copied to clipboard!', 'success');
                });
            }

            static downloadCanvas(canvas, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL();
                link.click();
            }
        }

        // Event handlers
        function initializeApp() {
            // Login form
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('loginError');

                if (Auth.login(username, password)) {
                    Auth.showApp();
                    errorEl.classList.add('hidden');
                } else {
                    errorEl.textContent = 'Invalid username or password';
                    errorEl.classList.remove('hidden');
                }
            });

            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', () => {
                Auth.showLogin();
                // Reset form
                document.getElementById('loginForm').reset();
            });

            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active class from all tabs and contents
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    // Add active class to clicked tab and corresponding content
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
                });
            });

            // Generate QR code
            document.getElementById('generateBtn').addEventListener('click', async () => {
                const message = document.getElementById('messageInput').value;
                const password = document.getElementById('encryptPassword').value;
                const generateBtn = document.getElementById('generateBtn');

                if (!message.trim()) {
                    alert('Please enter a message to encrypt');
                    return;
                }

                if (!password) {
                    alert('Please enter an encryption password');
                    return;
                }

                try {
                    generateBtn.disabled = true;
                    generateBtn.textContent = 'Generating...';
                    
                    const encrypted = CryptoUtil.encrypt(message, password);
                    console.log('Encrypted data:', encrypted);
                    
                    await QRUtil.generateQR(encrypted);
                    
                    document.getElementById('encryptedText').textContent = encrypted;
                    UIUtil.showElement('qrPreview');
                    UIUtil.showElement('encryptResult');
                    
                    generateBtn.textContent = 'Generate Secure QR Code';
                    generateBtn.disabled = false;
                } catch (error) {
                    console.error('Generation error:', error);
                    alert('Error generating QR code: ' + error.message);
                    generateBtn.textContent = 'Generate Secure QR Code';
                    generateBtn.disabled = false;
                }
            });

            // Save QR as PNG
            document.getElementById('saveQrBtn').addEventListener('click', () => {
                const canvas = document.getElementById('qrCanvas');
                UIUtil.downloadCanvas(canvas, 'secure-qr-code.png');
            });

            // Copy encrypted data
            document.getElementById('copyEncryptedBtn').addEventListener('click', () => {
                const text = document.getElementById('encryptedText').textContent;
                UIUtil.copyToClipboard(text);
            });

            // Camera controls
            document.getElementById('startCameraBtn').addEventListener('click', async () => {
                try {
                    videoStream = await CameraUtil.startCamera();
                    document.getElementById('startCameraBtn').disabled = true;
                    document.getElementById('stopCameraBtn').disabled = false;
                    UIUtil.showStatus('cameraStatus', 'Camera started. Position QR code in view.', 'success');
                    
                    // Start continuous scanning
                    isScanning = true;
                    scanLoop();
                } catch (error) {
                    UIUtil.showStatus('cameraStatus', error.message, 'error');
                }
            });

            document.getElementById('stopCameraBtn').addEventListener('click', () => {
                isScanning = false;
                CameraUtil.stopCamera(videoStream);
                videoStream = null;
                document.getElementById('startCameraBtn').disabled = false;
                document.getElementById('stopCameraBtn').disabled = true;
                UIUtil.showStatus('cameraStatus', 'Camera stopped.', 'info');
            });

            // Manual decrypt from camera
            document.getElementById('manualDecryptBtn').addEventListener('click', () => {
                const password = document.getElementById('decryptPassword').value;
                
                if (!password) {
                    alert('Please enter decryption password');
                    return;
                }

                if (!videoStream) {
                    alert('Please start camera first');
                    return;
                }

                try {
                    const qrData = CameraUtil.captureFrame();
                    if (qrData) {
                        const decrypted = CryptoUtil.decrypt(qrData, password);
                        document.getElementById('decryptedText').textContent = decrypted;
                        UIUtil.showElement('decryptResult');
                        UIUtil.showStatus('cameraStatus', 'QR code decrypted successfully!', 'success');
                    } else {
                        UIUtil.showStatus('cameraStatus', 'No QR code detected in camera view.', 'error');
                    }
                } catch (error) {
                    UIUtil.showStatus('cameraStatus', 'Decryption failed: ' + error.message, 'error');
                }
            });

            // Upload and decrypt
            document.getElementById('uploadDecryptBtn').addEventListener('click', async () => {
                const fileInput = document.getElementById('fileInput');
                const password = document.getElementById('uploadDecryptPassword').value;

                if (!fileInput.files[0]) {
                    alert('Please select an image file');
                    return;
                }

                if (!password) {
                    alert('Please enter decryption password');
                    return;
                }

                try {
                    UIUtil.showStatus('uploadStatus', 'Processing image...', 'info');
                    const qrData = await QRUtil.processImageFile(fileInput.files[0]);
                    
                    if (qrData) {
                        const decrypted = CryptoUtil.decrypt(qrData, password);
                        document.getElementById('decryptedText').textContent = decrypted;
                        UIUtil.showElement('decryptResult');
                        UIUtil.showStatus('uploadStatus', 'QR code decrypted successfully!', 'success');
                    } else {
                        UIUtil.showStatus('uploadStatus', 'No QR code found in image.', 'error');
                    }
                } catch (error) {
                    UIUtil.showStatus('uploadStatus', 'Error: ' + error.message, 'error');
                }
            });

            // Copy decrypted message
            document.getElementById('copyDecryptedBtn').addEventListener('click', () => {
                const text = document.getElementById('decryptedText').textContent;
                UIUtil.copyToClipboard(text);
            });
        }

        // Continuous scanning loop
        function scanLoop() {
            if (!isScanning || !videoStream) return;

            try {
                const qrData = CameraUtil.captureFrame();
                if (qrData) {
                    const password = document.getElementById('decryptPassword').value;
                    if (password) {
                        try {
                            const decrypted = CryptoUtil.decrypt(qrData, password);
                            document.getElementById('decryptedText').textContent = decrypted;
                            UIUtil.showElement('decryptResult');
                            UIUtil.showStatus('cameraStatus', 'QR code detected and decrypted!', 'success');
                            
                            // Stop scanning after successful decode
                            isScanning = false;
                            return;
                        } catch (error) {
                            // Continue scanning if decryption fails
                        }
                    }
                }
            } catch (error) {
                console.error('Scan loop error:', error);
            }

            // Continue scanning
            setTimeout(scanLoop, 100);
        }

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializeApp);

        // Service worker for offline capability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {
                    // Silent fail - service worker is optional
                });
            });
        }
    </script>
</body>
</html>
